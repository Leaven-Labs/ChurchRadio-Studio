# Dependabot proposes newer versions of the pinned build inputs, as pull requests (the Release
# workflow builds and tests each one). Once a week; one pull request per kind.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
