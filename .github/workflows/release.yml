name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.3.0"
  push:
    tags:
      - "v*"
  # Build + tests + smoke on every PR so the branch has a green run (no release step).
  pull_request:

# One build at a time per branch/PR; don't let manual runs pile up.
concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  # The builds only read the repository. The release job alone may write (see there).
  contents: read

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Run unit tests (stop if any fail)
        shell: pwsh
        run: python -m unittest discover -s tests -v

      # The version: the tag for a release, else a dev number (PR builds).
      - name: Work out the version
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
              $payload = (Get-Content "$env:GITHUB_EVENT_PATH" -Raw) | ConvertFrom-Json
              $tag = $payload.inputs.version
          } elseif ($env:GITHUB_REF -like "refs/tags/v*") {
              $tag = $env:GITHUB_REF_NAME
          } else {
              $tag = "v0.0.0-dev$env:GITHUB_RUN_NUMBER"
          }
          "CRS_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CRS_VERSION=$($tag.TrimStart('v'))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Set-Content version.txt $tag.TrimStart('v') -Encoding ascii -NoNewline
          Write-Host "Version: $tag"

      # ------------------------------------------------------------------
      # Build the program folder from the CLEAN tracked files. Do NOT edit
      # config.json before building: it is bundled, so any change here would
      # ship to every user's first-run copy.
      # ------------------------------------------------------------------
      - name: Build the program folder (PyInstaller)
        shell: pwsh
        run: |
          pyinstaller ChurchRadio-Studio.spec
          if (-not (Test-Path dist\ChurchRadio-Studio\ChurchRadio-Studio.exe)) { throw "PyInstaller did not make the program folder" }
          $mb = [math]::Round(((Get-ChildItem dist\ChurchRadio-Studio -Recurse -File | Measure-Object Length -Sum).Sum)/1MB, 1)
          Write-Host "Program folder: $mb MB"

      # ffmpeg is installed with the app: the LGPL build from BtbN/FFmpeg-Builds (no GPL parts,
      # so it can be shipped with this app). The newest release-branch build is used; the step
      # checks that it is LGPL, that it can write MP3 and that the filters the app uses exist.
      - name: Get ffmpeg (LGPL build)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $rel = Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } `
              -Uri "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/tags/latest"
          $assets = $rel.assets | Where-Object { $_.name -match '^ffmpeg-n(\d+)\.(\d+)-latest-win64-lgpl-\d+\.\d+\.zip$' } |
              Sort-Object { [int]($_.name -replace '^ffmpeg-n(\d+)\.(\d+).*$','$1') * 1000 + [int]($_.name -replace '^ffmpeg-n(\d+)\.(\d+).*$','$2') } -Descending
          if (-not $assets) { throw "No LGPL win64 ffmpeg build found in BtbN/FFmpeg-Builds 'latest'." }
          $asset = $assets[0]
          Write-Host "ffmpeg build: $($asset.name)"
          $zip = Join-Path $env:RUNNER_TEMP $asset.name
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
          Write-Host "SHA-256: $((Get-FileHash $zip -Algorithm SHA256).Hash)"
          $x = Join-Path $env:RUNNER_TEMP "ffmpeg-x"
          Expand-Archive $zip -DestinationPath $x -Force
          $bin = Get-ChildItem $x -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $root = Split-Path (Split-Path $bin.FullName)
          New-Item -ItemType Directory -Force -Path build\ffmpeg | Out-Null
          Copy-Item (Join-Path $root "bin\ffmpeg.exe"), (Join-Path $root "bin\ffprobe.exe") build\ffmpeg\
          Get-ChildItem $root -File -Filter "LICENSE*" | Copy-Item -Destination build\ffmpeg\
          @(
            "ffmpeg is free software licensed under the GNU Lesser General Public License (LGPL) 2.1 or later.",
            "This copy is the LGPL Windows build $($asset.name) from https://github.com/BtbN/FFmpeg-Builds",
            "(build scripts and the exact library versions are listed there).",
            "ffmpeg source code: https://ffmpeg.org/download.html  -- ChurchRadio Studio runs ffmpeg as a",
            "separate program; it is not changed."
          ) | Set-Content build\ffmpeg\README-ffmpeg.txt -Encoding utf8
          $cfg = (& build\ffmpeg\ffmpeg.exe -hide_banner -buildconf 2>&1) -join "`n"
          if ($cfg -match "enable-gpl") { throw "This ffmpeg build is GPL, not LGPL. Not shipping it." }
          if ($cfg -notmatch "enable-libmp3lame") { throw "This ffmpeg build cannot write MP3 (no libmp3lame)." }
          $filters = (& build\ffmpeg\ffmpeg.exe -hide_banner -filters 2>&1) -join "`n"
          foreach ($f in "silencedetect","aselect","acompressor","alimiter","dynaudnorm","atrim","concat") {
              if ($filters -notmatch "\s$f\s") { throw "ffmpeg is missing the $f filter." }
          }
          & build\ffmpeg\ffmpeg.exe -v error -y -f lavfi -i "sine=d=2" -c:a libmp3lame -b:a 192k "$env:RUNNER_TEMP\t.mp3"
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg could not write a test MP3." }
          Get-ChildItem build\ffmpeg | Select-Object Name, Length

      - name: Collect the third-party licenses
        shell: pwsh
        run: |
          python tools/third_party_licenses.py build\licenses\THIRD-PARTY-LICENSES.txt
          if (-not (Select-String -Path build\licenses\THIRD-PARTY-LICENSES.txt -Pattern "faster-whisper" -Quiet)) { throw "The license list is missing faster-whisper." }

      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=$env:CRS_VERSION" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed." }
          Get-Item dist\ChurchRadio-Studio-Setup.exe | Select-Object Name, @{n='SizeMB';e={[math]::Round($_.Length/1MB,2)}}

      # ------------------------------------------------------------------
      # Smoke test the INSTALLED app: run the installer silently (for the current user, as a
      # church volunteer would), then run the installed program in --selftest mode. It must
      # find the ffmpeg that was installed with it, keep its files in %APPDATA%, and download
      # the speech models ONCE to the shared ProgramData folder (run 2 loads them from disk).
      # --uitest then makes every window once, off screen: the Qt parts are in the program.
      # ------------------------------------------------------------------
      - name: Install and smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dir = Join-Path $env:RUNNER_TEMP "crs-install"
          $p = Start-Process -FilePath dist\ChurchRadio-Studio-Setup.exe -Wait -PassThru -ArgumentList `
              "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$dir`"", "/LOG=`"$env:RUNNER_TEMP\setup.log`""
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup.log" | Write-Host; throw "Installer failed ($($p.ExitCode))." }
          $exe = Join-Path $dir "ChurchRadio-Studio.exe"
          if (-not (Test-Path $exe)) { throw "Installed program not found at $exe" }
          if (-not (Test-Path (Join-Path $dir "ffmpeg\ffmpeg.exe"))) { throw "ffmpeg was not installed." }
          foreach ($f in "licenses\LICENSE.txt", "licenses\THIRD-PARTY-LICENSES.txt") {
              if (-not (Test-Path (Join-Path $dir $f))) { throw "$f was not installed." }
          }

          function Invoke-Selftest { $out = @(); & $exe --selftest 2>&1 | ForEach-Object { $out += [string]$_ }; $out | Write-Host; return ($out -join "`n") }

          Write-Host "=== Selftest run 1 (first start: models download once) ==="
          $o1 = Invoke-Selftest
          if ($o1 -notmatch "selftest: OK") { throw "Selftest run 1 failed." }
          if ($o1 -notmatch [regex]::Escape("version $env:CRS_VERSION")) { throw "The app does not know its version ($env:CRS_VERSION)." }
          if ($o1 -notmatch [regex]::Escape("ffmpeg = $dir\ffmpeg\ffmpeg.exe")) { throw "The app did not use the ffmpeg installed with it." }
          if ($o1 -notmatch [regex]::Escape("data dir = $env:APPDATA\ChurchRadio Studio")) { throw "The app does not keep its files in %APPDATA%." }
          if (-not (Test-Path "$env:APPDATA\ChurchRadio Studio\config.json")) { throw "config.json was not created in %APPDATA%." }
          if (Test-Path (Join-Path $dir "config.json")) { throw "config.json was written into the program folder." }
          $models = Join-Path $env:ProgramData "ChurchRadio Studio\models"
          foreach ($m in @("base.en", "small.en")) {
              $bins = @(Get-ChildItem -Path (Join-Path $models ("models--Systran--faster-whisper-" + $m)) -Recurse -File -Filter "model.bin" -ErrorAction SilentlyContinue)
              if ($bins.Count -eq 0) { throw "$m did not download to the shared models folder." }
          }

          Write-Host "=== Selftest run 2 (models already on disk) ==="
          $o2 = Invoke-Selftest
          if ($o2 -notmatch "PRESENT before load" -or $o2 -match "MISSING before load") { throw "Run 2 would download the models again." }
          if ($o2 -notmatch "selftest: OK") { throw "Selftest run 2 failed." }

          Write-Host "=== Window test (--uitest: every window is made once, off screen) ==="
          $ui = (& $exe --uitest 2>&1 | ForEach-Object { [string]$_ }) -join "`n"
          Write-Host $ui
          if ($ui -notmatch "uitest: OK") { throw "The windows could not be made (--uitest)." }

          Write-Host "=== Headless build (--build, as Task Scheduler runs it) ==="
          # A 2-minute test recording with the date in its name. It has no speech, so the start and
          # end are not found and nothing is cut, but the speech models are loaded and searched.
          $rec = Join-Path $env:RUNNER_TEMP "crs-recordings"
          $out = Join-Path $env:RUNNER_TEMP "crs-out"
          New-Item -ItemType Directory -Force -Path $rec, $out | Out-Null
          & (Join-Path $dir "ffmpeg\ffmpeg.exe") -v error -y -f lavfi -i "sine=frequency=440:duration=120" -ac 2 `
              (Join-Path $rec "BLCTrad11.15.2026 08-10.wav")
          $cfgPath = "$env:APPDATA\ChurchRadio Studio\config.json"
          $cfg = Get-Content $cfgPath -Raw | ConvertFrom-Json
          $cfg.setup_done = $true
          $cfg.output_folder = $out
          $cfg.broadcast_name = "Headless Test"
          $cfg | ConvertTo-Json -Depth 10 | Set-Content $cfgPath -Encoding utf8
          function Invoke-Build([string[]]$more) {
              $log = Join-Path $env:RUNNER_TEMP ("crs-build-" + [guid]::NewGuid() + ".log")
              # Start-Process -Wait: the program has no console, so wait for it like Task Scheduler does.
              $p = Start-Process -FilePath $exe -Wait -PassThru -ArgumentList (@("--build", "`"$rec`"", "--log", "`"$log`"") + $more)
              $text = if (Test-Path $log) { Get-Content $log -Raw } else { "(no log written)" }
              Write-Host $text
              return @{ Code = $p.ExitCode; Log = $text }
          }
          $r = Invoke-Build @("--settle", "0")
          if ($r.Code -ne 0) { throw "Headless build failed (exit $($r.Code))." }
          $mp3 = Join-Path $out "Headless Test 2026-11-15.mp3"
          if (-not (Test-Path $mp3)) { throw "Headless build did not save $mp3." }
          if ($r.Log -notmatch "Saved:") { throw "The headless log does not say where the MP3 was saved." }
          $r = Invoke-Build @("--settle", "0")
          if ($r.Code -ne 0 -or $r.Log -notmatch "already made") { throw "A second run should find nothing to do." }
          $r = Invoke-Build @("--settle", "0", "--date", "15/11/2026")
          if ($r.Code -ne 1) { throw "A bad --date should end with exit code 1, not $($r.Code)." }
          if (Test-Path "$env:APPDATA\ChurchRadio Studio\build.lock") { throw "The headless build left its lock behind." }

          Write-Host "=== Uninstall keeps the user's files ==="
          $un = Get-ChildItem $dir -Filter "unins*.exe" | Select-Object -First 1
          $p = Start-Process -FilePath $un.FullName -Wait -PassThru -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          if ($p.ExitCode -ne 0) { throw "Uninstall failed ($($p.ExitCode))." }
          Start-Sleep -Seconds 3
          if (Test-Path $exe) { throw "Uninstall left the program behind." }
          if (-not (Test-Path "$env:APPDATA\ChurchRadio Studio\config.json")) { throw "Uninstall removed the user's settings." }
          Write-Host "Smoke test PASS: installed, ffmpeg found, files in %APPDATA%, models downloaded once, headless build works, uninstall keeps settings."

      # ------------------------------------------------------------------
      # Update test: install the PREVIOUS release, give it settings, then run this installer
      # over it. The update must keep the shortcuts, the settings and the song list. The previous
      # release goes into a folder with the app's earlier name, as on PCs that came from the old
      # app: the update must move to a "ChurchRadio Studio" folder beside it and remove the old
      # folder. Skipped when the repository has no earlier installer release.
      # ------------------------------------------------------------------
      - name: Update test (previous release -> this build)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $prev = Join-Path $env:RUNNER_TEMP "prev"
          New-Item -ItemType Directory -Force -Path $prev | Out-Null
          $tags = @(gh release list --repo $env:GITHUB_REPOSITORY --limit 20 --json tagName --jq '.[].tagName')
          $old = $null
          foreach ($t in $tags) {
              gh release download $t --repo $env:GITHUB_REPOSITORY --dir $prev --pattern "*-Setup.exe" --clobber 2>$null
              $old = Get-ChildItem $prev -Filter "*-Setup.exe" | Select-Object -First 1
              if ($old) { Write-Host "Previous installer: $t $($old.Name)"; break }
          }
          if (-not $old) { Write-Host "No earlier installer release: update test skipped."; exit 0 }

          $parent = Join-Path $env:RUNNER_TEMP "upgrade-install"
          $dir = Join-Path $parent "KNAF Broadcast Builder"
          $newDir = Join-Path $parent "ChurchRadio Studio"
          $p = Start-Process -FilePath $old.FullName -Wait -PassThru -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$dir`""
          if ($p.ExitCode -ne 0) { throw "The previous installer failed ($($p.ExitCode))." }
          $programs = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs"
          $oldExe = Get-ChildItem $dir -Filter "*.exe" | Where-Object { $_.Name -notlike "unins*" } | Select-Object -First 1
          Write-Host "Previous program: $($oldExe.Name)"

          # Settings as the previous version would have them.
          $oldData = "$env:APPDATA\ChurchRadio Studio"
          Remove-Item $oldData -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $oldData | Out-Null
          Set-Content (Join-Path $oldData "songs.csv") "file,title`nmarker.mp3,Update test marker" -Encoding utf8
          Set-Content (Join-Path $oldData "config.json") '{"setup_done": true, "broadcast_name": "Update Test"}' -Encoding utf8

          # Update with this build, as a volunteer would: no folder given, the installer finds the old one.
          $p = Start-Process -FilePath dist\ChurchRadio-Studio-Setup.exe -Wait -PassThru -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/LOG=`"$env:RUNNER_TEMP\update.log`""
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\update.log" | Write-Host; throw "Update failed ($($p.ExitCode))." }
          $exe = Join-Path $newDir "ChurchRadio-Studio.exe"
          if (-not (Test-Path $exe)) { Get-Content "$env:RUNNER_TEMP\update.log" | Write-Host; throw "The update did not install into $newDir." }
          if (Test-Path $dir) { throw "The old program folder $dir was left behind." }
          if (-not (Test-Path (Join-Path $programs "ChurchRadio Studio\ChurchRadio Studio.lnk"))) { throw "No ChurchRadio Studio Start-menu shortcut." }

          $out = (& $exe --selftest 2>&1 | ForEach-Object { [string]$_ }) -join "`n"
          Write-Host $out
          if ($out -notmatch "selftest: OK") { throw "Selftest after the update failed." }
          $songs = Join-Path $env:APPDATA "ChurchRadio Studio\songs.csv"
          if (-not (Test-Path $songs) -or ((Get-Content $songs -Raw) -notmatch "Update test marker")) { throw "The song list was not carried over." }
          $cfg = Get-Content (Join-Path $env:APPDATA "ChurchRadio Studio\config.json") -Raw | ConvertFrom-Json
          if ($cfg.broadcast_name -ne "Update Test") { throw "The settings were not carried over." }

          $un = Get-ChildItem $newDir -Filter "unins*.exe" | Select-Object -First 1
          Start-Process -FilePath $un.FullName -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" | Out-Null
          Write-Host "Update test PASS: moved out of the old-name folder, shortcut, settings and song list kept."

      - name: Upload the installer as artifact (for pre-release inspection)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: churchradio-studio-windows
          path: dist/ChurchRadio-Studio-Setup.exe
          retention-days: 30

  # ------------------------------------------------------------------
  # Linux: the program folder with an LGPL ffmpeg, packed as a .tar.gz with install.sh (installs
  # for the user, no root). Built on the oldest supported Ubuntu, so the program runs on the
  # Linux versions of the last few years (it needs the glibc of the build system or newer).
  # ------------------------------------------------------------------
  linux:
    name: Linux .tar.gz
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      # Qt (the app's windows) needs these system libraries. They are installed before the build so
      # that PyInstaller puts the ones Linux desktops do not all have (libxcb-cursor) in the program.
      - name: Install the libraries Qt needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libfontconfig1 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Run unit tests (stop if any fail)
        run: python -m unittest discover -s tests -v

      - name: Work out the version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then tag="$INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="$GITHUB_REF_NAME"
          else tag="v0.0.0-dev$GITHUB_RUN_NUMBER"; fi
          echo "CRS_TAG=$tag" >> "$GITHUB_ENV"
          echo "CRS_VERSION=${tag#v}" >> "$GITHUB_ENV"
          printf '%s' "${tag#v}" > version.txt
          echo "Version: $tag"

      - name: Build the program folder (PyInstaller)
        run: |
          pyinstaller ChurchRadio-Studio.spec
          test -x dist/ChurchRadio-Studio/ChurchRadio-Studio || { echo "PyInstaller did not make the program"; exit 1; }
          du -sh dist/ChurchRadio-Studio

      # The same LGPL build source as Windows (BtbN/FFmpeg-Builds), with the same checks.
      - name: Get ffmpeg (LGPL build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -r name url < <(gh api repos/BtbN/FFmpeg-Builds/releases/tags/latest --jq \
            '[.assets[] | select(.name | test("^ffmpeg-n[0-9]+\\.[0-9]+-latest-linux64-lgpl-[0-9]+\\.[0-9]+\\.tar\\.xz$"))]
             | sort_by(.name | capture("^ffmpeg-n(?<a>[0-9]+)\\.(?<b>[0-9]+)") | [(.a|tonumber), (.b|tonumber)])
             | last | "\(.name) \(.browser_download_url)"')
          [ -n "$name" ] && [ "$name" != "null" ] || { echo "No LGPL linux64 ffmpeg build found in BtbN/FFmpeg-Builds 'latest'."; exit 1; }
          echo "ffmpeg build: $name"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/$name" "$url"
          sha256sum "$RUNNER_TEMP/$name"
          mkdir -p "$RUNNER_TEMP/ffmpeg-x" && tar -xJf "$RUNNER_TEMP/$name" -C "$RUNNER_TEMP/ffmpeg-x"
          root=$(dirname "$(dirname "$(find "$RUNNER_TEMP/ffmpeg-x" -type f -name ffmpeg -path '*/bin/*' | head -1)")")
          ff=dist/ChurchRadio-Studio/ffmpeg
          mkdir -p "$ff"
          cp "$root/bin/ffmpeg" "$root/bin/ffprobe" "$ff/"
          cp "$root"/LICENSE* "$ff/" 2>/dev/null || true
          printf '%s\n' \
            "ffmpeg is free software licensed under the GNU Lesser General Public License (LGPL) 2.1 or later." \
            "This copy is the LGPL Linux build $name from https://github.com/BtbN/FFmpeg-Builds" \
            "(build scripts and the exact library versions are listed there)." \
            "ffmpeg source code: https://ffmpeg.org/download.html  -- ChurchRadio Studio runs ffmpeg as a" \
            "separate program; it is not changed." > "$ff/README-ffmpeg.txt"
          tools/check_ffmpeg.sh "$ff/ffmpeg"

      - name: Licenses, install script
        run: |
          d=dist/ChurchRadio-Studio
          python tools/third_party_licenses.py "$d/licenses/THIRD-PARTY-LICENSES.txt"
          grep -q faster-whisper "$d/licenses/THIRD-PARTY-LICENSES.txt" || { echo "The license list is missing faster-whisper."; exit 1; }
          cp LICENSE "$d/licenses/LICENSE.txt"
          cp tools/linux/install.sh "$d/install.sh"
          chmod +x "$d/install.sh"

      - name: Pack the .tar.gz
        run: |
          tar -C dist -czf dist/ChurchRadio-Studio-Linux-x86_64.tar.gz ChurchRadio-Studio
          ls -l dist/ChurchRadio-Studio-Linux-x86_64.tar.gz

      # Unpack the .tar.gz and install it as a user would, then test the installed program.
      - name: Install and smoke test
        run: |
          set -euo pipefail
          x=$(mktemp -d)
          tar -xzf dist/ChurchRadio-Studio-Linux-x86_64.tar.gz -C "$x"
          "$x/ChurchRadio-Studio/install.sh"
          app="$HOME/.local/share/churchradio-studio"
          test -f "$HOME/.local/share/applications/churchradio-studio.desktop" || { echo "No menu entry."; exit 1; }
          test -f "$app/licenses/THIRD-PARTY-LICENSES.txt" || { echo "The licenses were not installed."; exit 1; }
          tools/smoke_test.sh "$HOME/.local/bin/churchradio-studio" "$app/ffmpeg" \
            "$HOME/.config/churchradio-studio" "$HOME/.cache/churchradio-studio/models" "$CRS_VERSION"
          "$app/install.sh" --uninstall
          test ! -e "$app" || { echo "Uninstall left the program behind."; exit 1; }
          test -f "$HOME/.config/churchradio-studio/config.json" || { echo "Uninstall removed the settings."; exit 1; }

      - name: Upload the .tar.gz as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: churchradio-studio-linux
          path: dist/ChurchRadio-Studio-Linux-x86_64.tar.gz
          retention-days: 30

  # ------------------------------------------------------------------
  # macOS (Apple silicon): ChurchRadio Studio.app with an LGPL ffmpeg, in a .dmg. No one publishes
  # an LGPL-only macOS ffmpeg that can write MP3, so it is built here from the ffmpeg and LAME
  # sources (both LGPL; LAME linked in statically, no Homebrew libraries) and cached. The app is
  # signed ad hoc, not with an Apple Developer ID: the first start needs "Open Anyway".
  # ------------------------------------------------------------------
  macos:
    name: macOS .dmg
    runs-on: macos-15
    timeout-minutes: 60   # the ffmpeg build takes about 4 minutes when not cached

    env:
      PYTHONUNBUFFERED: "1"
      FFMPEG_VERSION: "7.1.1"
      LAME_VERSION: "3.100"
      # SHA-256 of the two source downloads. With a new version above, put its SHA-256 here.
      FFMPEG_SHA256: "733984395e0dbbe5c046abda2dc49a5544e7e0e1e2366bba849222ae9e3a03b1"
      LAME_SHA256: "ddfe36cab873794038ae2c1210557ad34857a4b6bdc515785d1da9e175b1da1e"
      MACOSX_DEPLOYMENT_TARGET: "14.0"  # onnxruntime and PyAV need macOS 14

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Run unit tests (stop if any fail)
        run: python -m unittest discover -s tests -v

      - name: Work out the version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then tag="$INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="$GITHUB_REF_NAME"
          else tag="v0.0.0-dev$GITHUB_RUN_NUMBER"; fi
          echo "CRS_TAG=$tag" >> "$GITHUB_ENV"
          echo "CRS_VERSION=${tag#v}" >> "$GITHUB_ENV"
          printf '%s' "${tag#v}" > version.txt
          echo "Version: $tag"

      - name: Cached ffmpeg build
        id: ffmpeg-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: build/ffmpeg-mac
          key: ffmpeg-${{ env.FFMPEG_VERSION }}-lame-${{ env.LAME_VERSION }}-macos14-arm64-v2

      - name: Build ffmpeg (LGPL, with LAME for MP3)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/src" pre="$RUNNER_TEMP/prefix" out="$PWD/build/ffmpeg-mac"
          mkdir -p "$src" "$pre" "$out"
          cd "$src"
          curl -fsSL --retry 5 -o lame.tar.gz "https://downloads.sourceforge.net/project/lame/lame/$LAME_VERSION/lame-$LAME_VERSION.tar.gz"
          curl -fsSL --retry 5 -o ffmpeg.tar.xz "https://ffmpeg.org/releases/ffmpeg-$FFMPEG_VERSION.tar.xz"
          # Stop if a download is not the file that is expected.
          printf '%s  %s\n' "$LAME_SHA256" lame.tar.gz "$FFMPEG_SHA256" ffmpeg.tar.xz | shasum -a 256 -c -
          tar -xzf lame.tar.gz && tar -xJf ffmpeg.tar.xz
          cd "lame-$LAME_VERSION"
          sed -i '' '/lame_init_old/d' include/libmp3lame.sym   # the known macOS link fix (as Homebrew does)
          ./configure --prefix="$pre" --disable-shared --enable-static --disable-frontend --disable-dependency-tracking
          make -j"$(sysctl -n hw.ncpu)" && make install
          cd "../ffmpeg-$FFMPEG_VERSION"
          # --disable-autodetect: nothing from Homebrew is linked in; only macOS's own zlib.
          ./configure --prefix="$pre" --disable-autodetect --enable-zlib --enable-libmp3lame \
            --disable-ffplay --disable-doc --disable-debug --disable-network \
            --extra-cflags="-I$pre/include" --extra-ldflags="-L$pre/lib"
          make -j"$(sysctl -n hw.ncpu)" && make install
          cp "$pre/bin/ffmpeg" "$pre/bin/ffprobe" "$out/"
          cp COPYING.LGPLv2.1 "$out/LICENSE-ffmpeg-LGPL-2.1.txt"
          cp LICENSE.md "$out/LICENSE-ffmpeg.md"
          cp "../lame-$LAME_VERSION/COPYING" "$out/LICENSE-lame-LGPL.txt"
          printf '%s\n' \
            "ffmpeg is free software licensed under the GNU Lesser General Public License (LGPL) 2.1 or later." \
            "This copy was built for ChurchRadio Studio from the unchanged sources of ffmpeg $FFMPEG_VERSION" \
            "(https://ffmpeg.org/releases/ffmpeg-$FFMPEG_VERSION.tar.xz) and LAME $LAME_VERSION (LGPL, for MP3;" \
            "https://lame.sourceforge.io), with no GPL parts. The build steps are in the 'macos' job of" \
            "https://github.com/Leaven-Labs/ChurchRadio-Studio/blob/main/.github/workflows/release.yml." \
            "ChurchRadio Studio runs ffmpeg as a separate program; it is not changed." > "$out/README-ffmpeg.txt"

      - name: Check ffmpeg
        run: |
          set -euo pipefail
          tools/check_ffmpeg.sh build/ffmpeg-mac/ffmpeg
          for b in ffmpeg ffprobe; do
            otool -L "build/ffmpeg-mac/$b"
            if otool -L "build/ffmpeg-mac/$b" | tail -n +2 | grep -vE '^\s+(/usr/lib/|/System/)'; then
              echo "$b links a library that is not part of macOS."; exit 1
            fi
            lipo -archs "build/ffmpeg-mac/$b"
          done

      - name: Build the app (PyInstaller)
        run: |
          pyinstaller ChurchRadio-Studio.spec
          test -x "dist/ChurchRadio Studio.app/Contents/MacOS/ChurchRadio-Studio" || { echo "PyInstaller did not make the app"; exit 1; }

      # ffmpeg and the licenses go in Contents/Resources (paths.resources_dir()). Adding files breaks
      # PyInstaller's signature, so the whole app is signed again (ad hoc): a broken signature makes
      # macOS call a downloaded app "damaged".
      - name: Add ffmpeg and the licenses, sign ad hoc
        run: |
          set -euo pipefail
          app="dist/ChurchRadio Studio.app"
          res="$app/Contents/Resources"
          mkdir -p "$res/ffmpeg" "$res/licenses"
          cp build/ffmpeg-mac/* "$res/ffmpeg/"
          python tools/third_party_licenses.py "$res/licenses/THIRD-PARTY-LICENSES.txt"
          grep -q faster-whisper "$res/licenses/THIRD-PARTY-LICENSES.txt" || { echo "The license list is missing faster-whisper."; exit 1; }
          cp LICENSE "$res/licenses/LICENSE.txt"
          codesign --force --sign - "$res/ffmpeg/ffmpeg" "$res/ffmpeg/ffprobe"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Pack the .dmg
        run: |
          set -euo pipefail
          stage=$(mktemp -d)
          ditto "dist/ChurchRadio Studio.app" "$stage/ChurchRadio Studio.app"
          ln -s /Applications "$stage/Applications"
          for i in 1 2 3 4 5; do   # hdiutil is sometimes "busy" on CI machines
            hdiutil create -volname "ChurchRadio Studio" -srcfolder "$stage" -ov -format UDZO \
              dist/ChurchRadio-Studio-macOS.dmg && break
            sleep $((i * 5))
          done
          test -f dist/ChurchRadio-Studio-macOS.dmg
          ls -l dist/ChurchRadio-Studio-macOS.dmg

      # Install from the .dmg as a user would (copy the app to /Applications), then test it.
      - name: Install and smoke test
        run: |
          set -euo pipefail
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" dist/ChurchRadio-Studio-macOS.dmg
          ditto "$mnt/ChurchRadio Studio.app" "/Applications/ChurchRadio Studio.app"
          hdiutil detach "$mnt"
          app="/Applications/ChurchRadio Studio.app"
          codesign --verify --deep --strict "$app"
          test -f "$app/Contents/Resources/licenses/THIRD-PARTY-LICENSES.txt" || { echo "The licenses are missing."; exit 1; }
          tools/smoke_test.sh "$app/Contents/MacOS/ChurchRadio-Studio" "$app/Contents/Resources/ffmpeg" \
            "$HOME/Library/Application Support/ChurchRadio Studio" "/Users/Shared/ChurchRadio Studio/models" "$CRS_VERSION"

      - name: Upload the .dmg as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: churchradio-studio-macos
          path: dist/ChurchRadio-Studio-macOS.dmg
          retention-days: 30

  # ------------------------------------------------------------------
  # Release: ONLY for dispatch / tag pushes, never for a PR, and only when all three builds and
  # their smoke tests passed. The release text is .github/RELEASE_NOTES.md: update its
  # "What's new" before each release.
  # ------------------------------------------------------------------
  release:
    name: Create tag + GitHub release
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # creates the tag and the GitHub release

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      - name: Get the three builds
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: dist
          pattern: churchradio-studio-*
          merge-multiple: true

      - name: SHA-256 checksums
        run: |
          cd dist
          sha256sum ChurchRadio-Studio-Setup.exe ChurchRadio-Studio-macOS.dmg ChurchRadio-Studio-Linux-x86_64.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create tag + GitHub release with the downloads
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then tag="$INPUT_VERSION"; else tag="$GITHUB_REF_NAME"; fi
          [ -n "$tag" ] || { echo "No tag/version determined. Provide one (e.g. v1.0.0)."; exit 1; }

          # Never force-move an existing tag that points at a different commit.
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            existing=$(git rev-list -n1 "refs/tags/$tag")
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "Tag $tag already exists at $existing, not at $GITHUB_SHA. Refusing to move it."; exit 1
            fi
          else
            git tag "$tag"
            git push origin "$tag"
          fi

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "ChurchRadio Studio $tag" --notes-file .github/RELEASE_NOTES.md --target "$GITHUB_SHA"
          fi
          for a in dist/ChurchRadio-Studio-Setup.exe dist/ChurchRadio-Studio-macOS.dmg \
                   dist/ChurchRadio-Studio-Linux-x86_64.tar.gz dist/SHA256SUMS.txt; do
            gh release upload "$tag" "$a" --clobber
          done
          gh release view "$tag" --json url,name,assets
