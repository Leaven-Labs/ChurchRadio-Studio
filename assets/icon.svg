<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <title>ChurchRadio Studio</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a7be0"/>
      <stop offset="1" stop-color="#1f3a68"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#g)"/>
  <!-- a radio set with its aerial, and a cross where the dial would be -->
  <g fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <rect x="50" y="98" width="156" height="106" rx="24"/>
    <path d="M92 98L150 48"/>
    <path d="M162 128V176M144 144H180"/>
  </g>
  <!-- the speaker -->
  <circle cx="100" cy="151" r="20" fill="#f2c14e"/>
</svg>
